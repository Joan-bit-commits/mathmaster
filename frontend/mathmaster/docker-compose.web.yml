# MathMaster web — static frontend serving the built SPA.
#
# Build:   docker compose -f docker-compose.web.yml up -d --build web
# The web service proxies /api/* to the backend container, so the stack
# runs standalone (backend + web) with no CORS configuration needed.

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
