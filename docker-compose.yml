services:
  api:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_learning && python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: 'true'
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: mathmaster_db
      DB_USER: postgres
      DB_PASSWORD: password
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mathmaster_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
